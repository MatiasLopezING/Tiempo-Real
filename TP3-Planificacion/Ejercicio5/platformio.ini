; PlatformIO Project Configuration File
; Sistemas de Tiempo Real - Practica 3
; Target: ATmega328P (Arduino Uno) @ 16 MHz
; Framework: Arduino + FreeRTOS (feilipu)

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps = feilipu/FreeRTOS
monitor_speed = 9600
build_type = debug
; Buffers del USART mas chicos: libera 80 bytes de RAM estatica, que hacen
; falta para las cinco tareas del Ejercicio 4. Estan protegidos con #if
; !defined() en el core de Arduino, asi que la bandera los pisa sin tocar nada.
build_flags =
  -g3
  -DSERIAL_TX_BUFFER_SIZE=32
  -DSERIAL_RX_BUFFER_SIZE=16
  ; Fuerza include/traza_switch.h en todas las unidades de compilacion,
  ; antes que Arduino_FreeRTOS.h. Alli se define traceTASK_SWITCHED_IN(),
  ; que la biblioteca deja vacio detras de un #ifndef: el nucleo pasa a
  ; manejar los pines del analizador en cada cambio de contexto. No se
  ; modifica ningun archivo de la biblioteca.
  -include "${platformio.include_dir}/traza_switch.h"
